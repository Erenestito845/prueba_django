{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mi Sitio Web{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
</head>
<body class="bg-light">
    <!-- Barra de navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'juegos_inicio' %}">Portal Informativo</a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'juegos_inicio' %}">Inicio Juegos</a>
                <a class="nav-link" href="{% url 'juegos_lista' %}">Catálogo Juegos</a>
                <a class="nav-link" href="{% url 'hardware_inicio' %}">Inicio Hardware</a>
                <a class="nav-link" href="{% url 'hardware_lista' %}">Catálogo Hardware</a>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Pie de página -->
    <footer class="text-center py-4 mt-5 bg-white border-top">
        <p class="text-muted mb-0">Evaluación Sumativa 2 - Django & MySQL</p>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
